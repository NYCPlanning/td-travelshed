name: Rotate Mapbox Token

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 1 * *'  # Runs on the 1st of each month

jobs:
  rotate-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # This step clones your repo

      - name: Fetch new Mapbox token
        id: fetch_token
        run: |
          echo "Simulating token fetch"
          NEW_TOKEN="pk.simulated-new-token-for-testing"
          echo "::set-output name=token::$NEW_TOKEN"

      - name: Update Mapbox token file
        run: |
          echo "${{ steps.fetch_token.outputs.token }}" > src/config/mapbox-token.txt

      - name: Commit updated token
        uses: EndBug/add-and-commit@v9
        with:
          add: 'src/config/mapbox-token.txt'
          message: 'Rotated Mapbox token'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
