name: Rotate Mapbox Token

on:
  workflow_dispatch:

jobs:
  update-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Replace MAPBOX_TOKEN in config.json
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          echo "Before replacement:"
          cat mapbox/public/config.json
          
          # Replace the placeholder in config.json
          sed -i "s|\${MAPBOX_TOKEN}|$MAPBOX_TOKEN|g" mapbox/public/config.json

          echo "After replacement:"
          cat mapbox/public/config.json

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'mapbox/public/config.json'
          message: 'Rotate Mapbox token'
